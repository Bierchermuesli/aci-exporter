name: Image

on:
  push:
    branches: [bit]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QUAY_IMAGE: quay.io/${{ vars.QUAY_REPOSITORY || 'stefan_grosser/aci-exporter' }}

jobs:
  build:
    name: Build and push to quay.io
    if: github.ref == 'refs/heads/bit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        run: >
          docker buildx build --pull --push
          --build-arg VERSION=$(git describe --tags --always)
          -t ${{ env.QUAY_IMAGE }}:$(git rev-parse --short HEAD)
          -t ${{ env.QUAY_IMAGE }}:latest
          --platform linux/amd64
          --cache-from type=gha
          --cache-to type=gha,mode=max
          .

  retag:
    name: Retag release image on quay.io
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # No rebuild: the release tag points at the image bit already pushed for this commit
      - name: Retag existing :<sha> image as the release version
        run: >
          docker buildx imagetools create
          --tag ${{ env.QUAY_IMAGE }}:${GITHUB_REF_NAME}
          ${{ env.QUAY_IMAGE }}:$(git rev-parse --short HEAD)
